<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="left">
            <img src="laundaryimage.jpg" alt="Laundry Image">
        </div>
        <div class="right">
            <div class="login-box">
                <h1>Hello Again!</h1>
                <p class="welcome">Welcome back! we missed you!</p>
                <form>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" placeholder="Emailid@site.com" required>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" placeholder="Password" required>
                    <a href="#" class="forgot">Forgot Password</a>
                    <button type="submit">Login</button>
                </form>
                <p class="register">Not a member? <span>Register Now</span></p>
            </div>
        </div>
    </div>
</body>

</html>
